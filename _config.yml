# Site identity
title: nblog · 小记
subtitle: pinned ...
description: 🧠 寄存处
author: nblog
language: zh-CN
timezone: Asia/Shanghai

# Public URL and article routes
url: https://nblog.github.io
root: /
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

# Content
source_dir: source
public_dir: public
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 1
render_drafts: false
post_asset_folder: true
relative_link: false
future: false
marked:
  prependRoot: true
  postAsset: true

# Code highlighting recommended by hsad
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  enable: true
  preprocess: true
  line_number: false
  tab_replace: ''

# Lists and dates
index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: 未分类
date_format: YYYY-MM-DD
time_format: HH:mm:ss
per_page: 10
pagination_dir: page

# Theme and on-demand search index
theme: hsad
search:
  path: search.xml
  field: post
  content: true
